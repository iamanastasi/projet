    <style>
      .selected {
            background-color: rgb(49, 133, 85); 
        }
    </style>
    </style>
    <script>
      createKalendar(getMesac(), getYear());
      let selectionCount = 0;
      var cellStart, cellEnd;
      function selectCell(event) {
          const cells = document.querySelectorAll('#kalendar td');
          cells.forEach(cell => cell.classList.remove('selected'));
          const selectedCell = event.target;
          selectedCell.classList.add('selected'); 
          selectionCount++;
          if(selectionCount==3)
          {
            selectionCount=1;
          }
          if(selectionCount==1)
          {
            cellStart = getYear()+'-'+getMesac()+'-'+selectedCell.textContent;
          }
          if(selectionCount==2)
          {
            cellEnd = getYear()+'-'+getMesac()+'-'+selectedCell.textContent;
          }
          console.log('Выделенная ячейка:', selectedCell.textContent); 
          console.log(selectionCount);
      }
  
      const cells = document.querySelectorAll('#kalendar td');
      cells.forEach(cell => {
          cell.addEventListener('click', selectCell);
      });
      </script>
