<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаблон</title>
    <link rel="stylesheet" href="main.css">
    <script src="app.js"></script>

  </head>

<body>
    <h1>Бронирование</h1>
    <form id="searchUserForm">
        <label for="secondName">Фамилия:</label>
        <input type="text" id="secondName" name="secondName" required><br>

        <label for="firstName">Имя:</label>
        <input type="text" id="firstName" name="firstName" required><br>
        <label for="thirdName">Отчество:</label>
        <input type="text" id="thirdName" name="thirdName"required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="telephone">Telephone:</label>
        <input type="text" id="telephone" name="telephone" required><br>
    </form>
    <form id="bookingForm" action="http://localhost:3000/add-book" method="POST">
        <input type="hidden" id="UserID" name="UserID" required><br>  
        <p>UserID: <span id="userIdResult"></span></p>
        <input type="hidden" id="PropertyID" name="PropertyID" required><br>
        <label for="Amount">Стоимость:</label>
        <input type="number" id="Amount" name="Amount" required><br>

        <label for="NumberPers">Количество человек:</label>
        <input type="number" id="NumberPers" name="NumberPers"required><br>
        <input type="hidden" id="StartDate" name="StartDate" required><br>
        <input type="hidden" id="EndDate" name="EndDate"required>

        <p>Начальная дата: <span id="anketStartDate"></span></p>
        <p>Конечная дата: <span id="anketEndDate"></span></p>
        <p>Нажмите 2 раза</p>
        <button type="submit">Забронировать</button>
    </form>
 
    <script>
        const propID = localStorage.getItem('propertyNumber');
        const startDate = localStorage.getItem('startDate'+propID);
        const endDate = localStorage.getItem('endDate'+propID);

        if (startDate && endDate) {
            document.getElementById('PropertyID').value= propID;
            document.getElementById('anketStartDate').textContent= startDate;
            document.getElementById('StartDate').value= startDate;
            document.getElementById('anketEndDate').textContent=endDate;
            document.getElementById('EndDate').value= endDate;
        } else {
            document.getElementById('anketStartDate').textContent='Не указана';
            document.getElementById('anketEndDate').textContent='Не указана';
        }
        document.getElementById('bookingForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const userData = {
        secondName: document.getElementById('secondName').value.trim(),
        firstName: document.getElementById('firstName').value.trim(),
        thirdName: document.getElementById('thirdName').value.trim() || null,
        email: document.getElementById('email').value.trim(),
        telephone: document.getElementById('telephone').value.trim()
    };

    function getUserID() {
        return fetch('http://localhost:3000/find-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.error || 'Ошибка сервера'); });
            }
            return response.json();
        })
        .then(data => {
            if (!data.userId) {
                throw new Error('Не удалось получить ID пользователя');
            }
            return data.userId;
        });
    }

    function booking(userId) {
        const bookData = {
            UserID: userId,
            PropertyID: document.getElementById('PropertyID').value,
            Amount: document.getElementById('Amount').value,
            NumberPers: document.getElementById('NumberPers').value,
            StartDate: document.getElementById('StartDate').value,
            EndDate: document.getElementById('EndDate').value,
        };

        return fetch('http://localhost:3000/add-book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookData),
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.error || 'Ошибка сервера'); });
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                throw new Error(data.error);
            }
            return data.message || 'Бронирование успешно добавлено';
        });
    }

    getUserID()
        .then(userId => {
            document.getElementById('UserID').value = userId;
            document.getElementById('userIdResult').textContent = userId;
            return booking(userId);
        })
        .then(message => {
            alert('Успех: ' + message);
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert('Ошибка: ' + error.message);
        });
});
    </script>
</body>
</html>
