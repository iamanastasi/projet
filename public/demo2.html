<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Booking</title>
</head>
<body>
    <h1>Add Booking</h1>
    <form action="/add-booking" method="POST">
        <label for="UserID">User:</label>
        <input type="number" id="UserID" name="UserID" required><br>

        <label for="PropertyID">Property:</label>
        <input type="number" id="PropertyID" name="PropertyID" required><br>

        <label for="StartDate">Заезд:</label>
        <input type="text" id="StartDate" name="StartDate"><br>

        <label for="EndDate">Выезд:</label>
        <input type="text" id="EndDate" name="EndDate" required><br>

        <label for="Amount">Стоимость:</label>
        <input type="number" id="Amount" name="Amount" required><br>

        <label for="NumberPers">Tenant Number:</label>
        <input type="number" id="NumberPers" name="NumberPers"><br>

        <button type="submit">Add Booking</button>
    </form>
</body>
</html>
